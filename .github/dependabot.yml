version: 2

updates:
  - package-ecosystem: "npm" # Change to "pnpm" or "yarn" if using them
    directory: "/"
    rebase-strategy: auto
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    commit-message:
      prefix: "chore(deps)"
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next-ecosystem:
        patterns:
          - "next"
          - "@next/*"
      tooling-linters:
        patterns:
          - "eslint*"
          - "prettier*"
          - "turbo"
